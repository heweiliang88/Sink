name: Sink CI (build output + optional deploy)

# job 作用：
#   1. 构建 Nuxt 产物，并发布到 ci-output 分支（便于在无法获得构建环境的设备上取回部署）
#   2. 若配置了 CLOUDFLARE_API_TOKEN secret，则顺带完成 D1 迁移 + 部署

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sink-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: bd180d635d64d5d30a04ae372e13c03b
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_D1_DATABASE_ID: b237f1fe-5b46-4382-b4d4-854a6c393d26
      DEPLOY_D1_DATABASE_NAME: sink
      DEPLOY_KV_NAMESPACE_ID: 7d2a2769c557419ab5edf8b971bf5201
      DEPLOY_KV_PREVIEW_NAMESPACE_ID: 7d2a2769c557419ab5edf8b971bf5201
      DEPLOY_R2_BUCKET_NAME: sink
      DEPLOY_R2_PREVIEW_BUCKET_NAME: sink
      DEPLOY_ANALYTICS_DATASET: sink
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish build output to ci-output branch
        run: |
          set -e
          rm -rf /tmp/out && mkdir -p /tmp/out
          cp -r .output /tmp/out/.output
          cp -r drizzle /tmp/out/drizzle
          cp wrangler.jsonc package.json /tmp/out/
          cd /tmp/out
          git init -q -b ci-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "build ${GITHUB_SHA::7} $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-output
          echo "::notice title=CI_OUTPUT_READY::构建产物已发布到 ci-output 分支"

      - name: Migrate D1 and deploy to Cloudflare
        if: env.HAS_TOKEN == 'true'
        run: |
          set -o pipefail
          pnpm deploy:worker 2>&1 | tee /tmp/deploy.log

      - name: Surface deploy error in annotations
        if: failure() && env.HAS_TOKEN == 'true'
        run: |
          tail -c 900 /tmp/deploy.log | tr -d '\r' | tr '\n' '|' | sed 's/%/%25/g' | awk '{print "::error title=Deploy output tail::" $0}'
