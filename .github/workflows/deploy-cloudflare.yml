name: Deploy Sink to Cloudflare Workers

# 触发方式：push 到 master，或在 Actions 页面手动 Run workflow
# 部署资源：D1 sink / KV sink / R2 sink（Account bd180d635d64d5d30a04ae372e13c03b）

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: sink-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: bd180d635d64d5d30a04ae372e13c03b
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # --- Sink 部署资源（对应 wrangler.jsonc 里的绑定）---
      DEPLOY_D1_DATABASE_ID: b237f1fe-5b46-4382-b4d4-854a6c393d26
      DEPLOY_D1_DATABASE_NAME: sink
      DEPLOY_KV_NAMESPACE_ID: 7d2a2769c557419ab5edf8b971bf5201
      DEPLOY_KV_PREVIEW_NAMESPACE_ID: 7d2a2769c557419ab5edf8b971bf5201
      DEPLOY_R2_BUCKET_NAME: sink
      DEPLOY_R2_PREVIEW_BUCKET_NAME: sink
      DEPLOY_ANALYTICS_DATASET: sink
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # 把关键诊断写进 annotation（公开可见），便于远端排查
      - name: Verify Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error title=NO_TOKEN::CLOUDFLARE_API_TOKEN repository secret is NOT set"
            exit 1
          fi
          resp=$(curl -s --max-time 20 -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "verify => $resp"
          case "$resp" in
            *'"success":true'*) echo "::notice title=TOKEN_OK::token verified" ;;
            *) echo "::error title=TOKEN_INVALID::${resp}" ;;
          esac

      - name: Migrate D1 and deploy to Cloudflare
        id: deploy
        run: |
          set -o pipefail
          pnpm deploy:worker 2>&1 | tee /tmp/deploy.log

      - name: Surface deploy error in annotations
        if: failure()
        run: |
          if [ -f /tmp/deploy.log ]; then
            tail -c 900 /tmp/deploy.log | tr -d '\r' | tr '\n' '|' | sed 's/%/%25/g' | awk '{print "::error title=Deploy output tail::" $0}'
          else
            echo "::error title=Deploy output missing::/tmp/deploy.log not found, failed at an earlier step"
          fi
